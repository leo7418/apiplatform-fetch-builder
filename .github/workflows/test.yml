name: Test

on:
  push:
    branches:
      - "main"
    tags-ignore:
      - "*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - run: pnpm install

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      - run: node dist/cli/main.js --help

  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ["18.x", "20.x", "22.x", "24.x"]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"

      - run: pnpm install

      - run: pnpm test:compiled

  typescript:
    name: TypeScript ${{ matrix.typescript }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        typescript: ["5.0", "5.4", "5.9"]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - run: pnpm install

      - run: pnpm build

      - run: npx -y -p typescript@${{ matrix.typescript }} tsc -p examples/entity-service-builder

      - run: npx -y -p typescript@${{ matrix.typescript }} tsc -p examples/hydra-prefix

      - run: npx -y -p typescript@${{ matrix.typescript }} tsc -p examples/generated

  integration:
    name: API Platform ${{ matrix.api-platform }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        api-platform: ["3.4", "4.4", "5.0"]

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - run: integration/run.sh ${{ matrix.api-platform }}
